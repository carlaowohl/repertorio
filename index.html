<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111317">
  <title>Repertório</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Repertório</div>
    <nav class="tabs">
      <a href="#/musicas" data-tab="musicas">Músicas</a>
      <a href="#/repertorios" data-tab="repertorios">Repertórios</a>
    </nav>
    <div class="actions">
      <button class="btn primary" data-action="import">+ Importar</button>
      <button class="btn" data-action="sync">⟳ Sincronizar</button>
      <button class="btn icon" data-action="menu" aria-label="Mais opções">⋮</button>
    </div>
  </header>

  <main id="view"></main>

  <section id="show" hidden>
    <div class="show-stage" data-show="toggle">
      <img id="showImg" alt="">
    </div>
    <div class="show-zone prev" data-show="prev"></div>
    <div class="show-zone mid" data-show="toggle"></div>
    <div class="show-zone next" data-show="next"></div>
    <div class="show-bar top">
      <button class="btn ghost" data-show="exit">✕ Sair</button>
      <button class="show-title" data-show="jump"></button>
      <button class="btn ghost" data-show="fit">⇔</button>
    </div>
    <div class="show-bar bottom">
      <span id="showPos"></span>
      <span id="showNext"></span>
    </div>
    <div id="jumpList" class="jump" hidden></div>
  </section>

  <dialog id="dlg"></dialog>
  <div id="toast" role="status"></div>

  <input type="file" id="fileInput" accept="image/*" multiple hidden>
  <input type="file" id="folderInput" accept="image/*" webkitdirectory multiple hidden>
  <input type="file" id="backupInput" accept="application/json,.json" hidden>

  <script type="module" src="js/app.js"></script>
</body>
</html>
